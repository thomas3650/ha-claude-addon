name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck jq

      - name: Lint
        run: shellcheck -x -s bash ha-claude/rootfs/usr/local/lib/ha-claude/*.sh ha-claude/rootfs/usr/local/bin/* tests/container.sh

      - name: Unit tests
        run: bats tests/

      - name: Build the image
        run: docker build -t ha-claude:ci ha-claude

      - name: Container smoke test
        run: tests/container.sh ha-claude:ci

      - name: Root-only unit tests inside the image
        run: |
          docker run --rm -v "$PWD:/src" -w /src ha-claude:ci bash -c \
            "apt-get update -qq && apt-get install -y -qq bats >/dev/null && bats tests/layout.bats"
