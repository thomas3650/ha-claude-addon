name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck jq python3-pip

      - name: Install the schema validator
        run: python3 -m pip install --break-system-packages jsonschema==4.26.0

      # Node, as the image has it, for the jobs server and its tests.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Every command is bash but the jobs and documents servers, which are Node.
      - name: Lint
        run: |
          shellcheck -x -s bash ha-claude/rootfs/usr/local/lib/ha-claude/*.sh tests/container.sh \
            $(ls ha-claude/rootfs/usr/local/bin/* | grep -v -e '/ha-claude-jobs-mcp$' -e '/ha-claude-docs-mcp$')
          node --check ha-claude/rootfs/usr/local/bin/ha-claude-jobs-mcp
          node --check ha-claude/rootfs/usr/local/bin/ha-claude-docs-mcp

      - name: Unit tests
        run: bats tests/

      - name: Build the image
        run: docker build -t ha-claude:ci ha-claude

      # Ubuntu 24.04 stops unprivileged user namespaces, which Chromium's
      # sandbox needs; Home Assistant OS does not, so the runner is made alike.
      - name: Container smoke test
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          tests/container.sh ha-claude:ci

      - name: Root-only unit tests inside the image
        run: |
          docker run --rm -v "$PWD:/src" -w /src ha-claude:ci bash -c \
            "apt-get update -qq && apt-get install -y -qq bats >/dev/null && bats tests/layout.bats"
