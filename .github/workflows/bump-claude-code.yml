name: Bump Claude Code and the base images

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The Dockerfile names three things exactly: Claude Code by version,
      # and the two base images by digest. Each is moved to what its name
      # means today. A value that does not look like one stops the run, so
      # nothing odd is written into the Dockerfile.
      - name: Open a pull request when something is newer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          file=ha-claude/Dockerfile
          digest() { docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}'; }
          claude="$(npm view @anthropic-ai/claude-code version)"
          node="$(digest node:22-bookworm-slim)"
          ubuntu="$(digest ubuntu:24.04)"
          [[ "$claude" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a version: $claude"; exit 1; }
          for d in "$node" "$ubuntu"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "not a digest: $d"; exit 1; }
          done
          sed -i -E \
            -e "s/^ARG CLAUDE_CODE_VERSION=.*/ARG CLAUDE_CODE_VERSION=$claude/" \
            -e "s|^(FROM node:22-bookworm-slim)@sha256:[0-9a-f]{64}|\\1@$node|" \
            -e "s|^(FROM ubuntu:24.04)@sha256:[0-9a-f]{64}|\\1@$ubuntu|" "$file"
          if git diff --quiet -- "$file"; then echo "nothing is newer"; exit 0; fi
          grep -c "@$node AS node\$" "$file" | grep -qx 1
          grep -c "^FROM ubuntu:24.04@$ubuntu\$" "$file" | grep -qx 1
          branch="bump-$(git diff -- "$file" | sha256sum | cut -c1-12)"
          git ls-remote --exit-code origin "refs/heads/$branch" && { echo "pull request already open"; exit 0; }
          title="fix: Claude Code $claude and this week's base images"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "$title"
          git push origin "$branch"
          gh pr create --title "$title" --body "Moves what the Dockerfile pins to what is current: Claude Code $claude, and the digests of \`node:22-bookworm-slim\` and \`ubuntu:24.04\`. The diff shows which of the three changed. The checks do not run by themselves on a pull request this workflow opens: close and reopen it to run them, and check that the add-on still works after installing this version."
