name: HA Claude
version: 0.10.1
slug: ha_claude
description: Claude Code with Remote Control as an always-on assistant
url: https://github.com/thomas3650/ha-claude-addon
image: ghcr.io/thomas3650/ha-claude-addon
arch:
  - aarch64
  - amd64
init: true
startup: application
boot: auto
stdin: true
homeassistant_api: true
ingress: true
ingress_port: 7681
ingress_stream: true
panel_icon: mdi:robot-outline
panel_title: Claude
watchdog: tcp://[HOST]:[PORT:7681]
backup_exclude:
  - home/.cache/**
  - home/.npm/**
  - repo/**
  - state/morning.log
  - state/report.out
options:
  session_name: Home
  extra_packages: []
  assistant_env: []
  extra_mcp: []
  morning_timeout: 900
  morning_max_turns: 40
schema:
  session_name: str
  repo_url: str?
  repo_path: match(^[A-Za-z0-9._/-]+$)?
  deploy_key: password?
  extra_packages:
    - str
  assistant_env:
    - match(^ASSISTANT_[A-Z0-9_]+=.*$)
  extra_mcp:
    - match(^[a-z][a-z0-9-]{0,31}=https?://[A-Za-z0-9._:/-]+$)
  morning_timeout: int(60,3600)
  morning_max_turns: int(1,200)
