<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude</title>
<style>
  html, body { height: 100%; margin: 0; background: #1e1e1e; color: #ddd; font: 14px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  nav { display: flex; gap: 4px; padding: 4px 8px; background: #2b2b2b; }
  nav a { color: #ddd; text-decoration: none; padding: 4px 12px; border-radius: 4px; }
  nav a.on { background: #444; color: #fff; }
  nav span { margin-left: auto; padding: 4px 0; color: #999; }
  iframe { flex: 1; border: 0; width: 100%; }
</style>
</head>
<body>
<nav>
  <a id="claude" class="on" href="claude/" target="term">Claude</a>
  <a id="shell" href="shell/" target="term">Shell</a>
  <span>Click in the terminal to type</span>
</nav>
<iframe name="term" src="claude/" title="Terminal"></iframe>
<script>
  // Marks the chosen link. The links work without it.
  document.querySelectorAll('nav a').forEach(function (a) {
    a.addEventListener('click', function () {
      document.querySelectorAll('nav a').forEach(function (b) { b.className = ''; });
      a.className = 'on';
    });
  });
</script>
</body>
</html>
